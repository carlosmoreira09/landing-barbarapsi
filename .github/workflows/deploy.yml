name: Landing - Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: barbara-psi-production
  cancel-in-progress: true

# O site e estatico: o build roda AQUI, no runner, e a VPS so recebe a pasta
# `out/`. Nada de `pnpm install` nem `next build` na VPS -- ela tem 1 GB de
# RAM e um build la passava de 1 GB sozinho.
env:
  SITE: tdahnavidaadulta.barbaralealreis.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build (static export)
        run: pnpm run build

      - name: Conferir saida
        run: test -f out/index.html && test -f out/404.html && test -f out/sitemap.xml && test -f out/robots.txt

      - name: Empacotar
        run: tar -czf site.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Publicar em /var/www/sites
        run: |
          scp -i ~/.ssh/id_rsa site.tar.gz "root@${{ secrets.VPS_HOST }}:/tmp/$SITE.tar.gz"
          ssh -i ~/.ssh/id_rsa "root@${{ secrets.VPS_HOST }}" "SITE=$SITE bash -s" << 'EOF'
            set -euo pipefail
            D="/var/www/sites/$SITE"

            rm -rf "$D.new" "$D.old"
            mkdir -p "$D.new"
            tar -xzf "/tmp/$SITE.tar.gz" -C "$D.new"
            rm -f "/tmp/$SITE.tar.gz"

            # Troca atomica: o site nunca fica pela metade no ar.
            [ -d "$D" ] && mv "$D" "$D.old"
            mv "$D.new" "$D"
            rm -rf "$D.old"

            echo ">>> publicado em $D ($(find "$D" -type f | wc -l) arquivos)"
          EOF

      # Pela URL publica, atraves do Caddy: nao existe mais porta local.
      - name: Healthcheck
        run: |
          for i in $(seq 1 5); do
            if curl -sfI "https://$SITE/" | head -1; then
              exit 0
            fi
            sleep 3
          done
          echo "site nao respondeu em https://$SITE/" >&2
          exit 1

      - name: Summary
        run: |
          echo "### 🚀 Frontend Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://$SITE" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
